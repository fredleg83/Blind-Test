<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Test — Buzzer</title><style>body{background:#101628;color:white;font-family:system-ui;text-align:center;padding:24px}select,button{font:inherit;padding:16px;border-radius:12px;max-width:100%;margin:12px}select{width:90%}button{border:0;color:white;background:#e43d50;font-weight:900}#buzz{width:230px;height:230px;border-radius:50%;font-size:32px;box-shadow:0 10px 30px #0006}#buzz:disabled{background:#555;opacity:.6}.note{color:#b8c6dc}</style></head><body><h1>🎵 Blind Test Party</h1><p id="status">Connexion à l'iPad…</p><div id="join" hidden><p>Choisis ton prénom</p><select id="player"></select><button id="ready">Je rejoins la partie</button></div><div id="play" hidden><h2 id="name"></h2><p id="category" class="note"></p><button id="buzz" disabled>BUZZ !</button><p id="message" class="note">En attente du morceau</p></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const room=new URLSearchParams(location.search).get('room'),status=document.getElementById('status'),join=document.getElementById('join'),play=document.getElementById('play'),sel=document.getElementById('player'),buzz=document.getElementById('buzz'),msg=document.getElementById('message');let conn,index=null,round=0,seen=[],finished=true,active=null;const peer=new Peer();peer.on('open',()=>{if(!room){status.textContent='Lien de partie manquant';return;}conn=peer.connect(room,{reliable:true});conn.on('open',()=>status.textContent='🟢 Connecté à l’iPad');conn.on('data',m=>{if(m.type==='roster'){sel.replaceChildren();m.players.forEach(p=>{const o=document.createElement('option');o.value=p.index;o.textContent=p.name;sel.append(o)});join.hidden=false;}if(m.type==='state'){round=m.round;seen=m.seen||[];finished=m.finished;active=m.active;document.getElementById('category').textContent=m.category||'';update();}});conn.on('close',()=>{status.textContent='Connexion perdue — recharge la page';buzz.disabled=true;});});peer.on('error',()=>status.textContent='Connexion impossible. Vérifie le lien et Internet.');document.getElementById('ready').onclick=()=>{index=Number(sel.value);document.getElementById('name').textContent=sel.selectedOptions[0]?.textContent||'';join.hidden=true;play.hidden=false;update();};function update(){if(index===null)return;const used=seen.includes(index);buzz.disabled=finished||used||!conn?.open;msg.textContent=finished?'En attente du prochain morceau':active===index?'🎤 À toi de répondre !':used?'Buzz enregistré — attends ton tour':'Tu peux buzzer !';}buzz.onclick=()=>{if(index===null||buzz.disabled)return;buzz.disabled=true;msg.textContent='Buzz envoyé…';conn.send({type:'buzz',index,round});};
</script></body></html>
