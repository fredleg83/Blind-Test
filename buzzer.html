<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Test V77 — Buzzer</title><style>body{background:#101628;color:white;font-family:system-ui;text-align:center;padding:24px}select,button{font:inherit;padding:16px;border-radius:12px;max-width:100%;margin:12px}select{width:90%}button{border:0;color:white;background:#e43d50;font-weight:900}#buzz{width:230px;height:230px;border-radius:50%;font-size:32px;box-shadow:0 10px 30px #0006}#buzz:disabled{background:#555;opacity:.6}.phone-timer{margin:12px auto;padding:10px;border:2px solid #ffffff30;border-radius:15px;max-width:260px;background:#ffffff0d}.phone-timer strong{display:block;font-size:54px;font-variant-numeric:tabular-nums;line-height:1.2}.phone-timer.urgent{border-color:#ffbf4d;color:#ffbf4d}.phone-timer.expired{border-color:#ff596e;color:#ff596e}.scores{margin:20px auto 0;max-width:480px;text-align:left;background:#ffffff0d;border:1px solid #ffffff25;border-radius:16px;padding:14px}.scores h2{margin:0 0 10px;font-size:20px}.score-row{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid #ffffff19}.score-row:last-child{border-bottom:0}.score-row.mine{background:#fbbf2422;border-radius:8px}.score-row strong{white-space:nowrap}.team-row{font-weight:700;color:#fbbf24}.scores small{color:#b8c6dc}.note{color:#b8c6dc}</style></head><body><h1>🎵 Blind Test Party</h1><p id="status">Connexion à l'iPad…</p><div id="join" hidden><p>Choisis ton prénom</p><select id="player"></select><button id="ready">Je rejoins la partie</button></div><div id="play" hidden><h2 id="name"></h2><p id="category" class="note"></p><button id="buzz" disabled>BUZZ !</button><p id="message" class="note">En attente du morceau</p><div id="phoneTimer" class="phone-timer"><small>⏱ Temps de réponse</small><strong id="phoneTime">--</strong><small>secondes</small></div></div><section id="scores" class="scores" hidden aria-live="polite"><h2>🏆 Classement en direct</h2><small id="goal"></small><div id="teams"></div><div id="scoreList"></div></section><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const room=new URLSearchParams(location.search).get('room'),status=document.getElementById('status'),join=document.getElementById('join'),play=document.getElementById('play'),sel=document.getElementById('player'),buzz=document.getElementById('buzz'),msg=document.getElementById('message');let conn,index=null,round=0,seen=[],finished=true,active=null,lastScores=null,timerEnd=0,timerSeconds=10;const peer=new Peer();peer.on('open',()=>{if(!room){status.textContent='Lien de partie manquant';return;}conn=peer.connect(room,{reliable:true});conn.on('open',()=>status.textContent='🟢 Connecté à l’iPad');conn.on('data',m=>{if(m.type==='roster'){sel.replaceChildren();m.players.forEach(p=>{const o=document.createElement('option');o.value=p.index;o.textContent=p.name;sel.append(o)});join.hidden=false;}if(m.type==='scores'){lastScores=m;renderScores(m);}if(m.type==='state'){round=m.round;seen=m.seen||[];finished=m.finished;active=m.active;timerEnd=Number(m.timerEnd)||0;timerSeconds=Number(m.timerSeconds)||10;paintPhoneTimer();document.getElementById('category').textContent=m.category||'';update();}});conn.on('close',()=>{status.textContent='Connexion perdue — recharge la page';buzz.disabled=true;});});peer.on('error',()=>status.textContent='Connexion impossible. Vérifie le lien et Internet.');document.getElementById('ready').onclick=()=>{index=Number(sel.value);document.getElementById('name').textContent=sel.selectedOptions[0]?.textContent||'';join.hidden=true;play.hidden=false;if(lastScores)renderScores(lastScores);update();};function renderScores(data){
 const host=document.getElementById('scores'),list=document.getElementById('scoreList'),teams=document.getElementById('teams');host.hidden=false;
 document.getElementById('goal').textContent='Objectif : '+data.goal+' points';
 list.replaceChildren();teams.replaceChildren();
 (data.teams||[]).forEach((t,i)=>{const row=document.createElement('div');row.className='score-row team-row';const label=document.createElement('span');label.textContent=(i+1)+'. '+t.name;const pts=document.createElement('strong');pts.textContent=t.score+' pts';row.append(label,pts);teams.append(row)});
 (data.players||[]).forEach((p,i)=>{const row=document.createElement('div');row.className='score-row'+(p.index===index?' mine':'');const label=document.createElement('span');label.textContent=(i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':String(i+1)+'. ')+p.name+(data.teamMode?' · Équipe '+(Number(p.teamId)+1):'');const pts=document.createElement('strong');pts.textContent=p.score+' pts';row.append(label,pts);list.append(row)});
}
function paintPhoneTimer(){const host=document.getElementById('phoneTimer'),out=document.getElementById('phoneTime');const live=active!==null&&!finished&&timerEnd>0;const left=live?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):null;out.textContent=left===null?'--':String(left);host.classList.toggle('urgent',left!==null&&left>0&&left<=3);host.classList.toggle('expired',left===0);}
setInterval(paintPhoneTimer,150);
function update(){if(index===null)return;const used=seen.includes(index);buzz.disabled=finished||used||!conn?.open;msg.textContent=finished?'En attente du prochain morceau':active===index?'🎤 À toi de répondre !':used?'Buzz enregistré — attends ton tour':'Tu peux buzzer !';}buzz.onclick=()=>{if(index===null||buzz.disabled)return;buzz.disabled=true;msg.textContent='Buzz envoyé…';conn.send({type:'buzz',index,round});};
</script></body></html>
